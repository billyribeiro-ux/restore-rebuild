<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The manuscript specifies Georgia, which is what most readers will have when
  they open the DOCX in Word or Pages. Georgia is not installed on this build
  machine, so without this rule LibreOffice would fall back to a default sans
  or Times clone when rendering the PDF. Bitstream Charter is a book serif with
  a similar large x-height and sturdy colour, so the PDF stays close to what a
  reader sees in Word.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <match target="pattern">
    <test name="family"><string>Georgia</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Bitstream Charter</string>
    </edit>
  </match>
</fontconfig>
